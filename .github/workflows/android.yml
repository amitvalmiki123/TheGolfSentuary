name: Build Android APK

on:
  push:
    branches: [ "arena/f257d954-thegolfsentuary", "main" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build web app (APK points to Sur Sangam cloud API)
        run: VITE_API_URL=https://sur-sangam-api.onrender.com npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK check (preinstalled on runner image)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms 2>/dev/null | head -5 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-3[0-9]|build-tools" | head -6 || true

      - name: Install Capacitor
        run: npm i --legacy-peer-deps @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 @capacitor/app@6 @capacitor/splash-screen@6 @capacitor/status-bar@6

      - name: Init + add Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate app icons (adaptive + legacy, ImageMagick)
        run: |
          set -e
          RES=android/app/src/main/res
          # adaptive background = theme colour
          if [ -f $RES/values/ic_launcher_background.xml ]; then
            sed -i 's/#[0-9A-Fa-f]*/#060306/' $RES/values/ic_launcher_background.xml
          else
            mkdir -p $RES/values && printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#060306</color></resources>\n' > $RES/values/ic_launcher_background.xml
          fi
          # anydpi xml -> adaptive, background drawable = colour
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/${n}_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
          done
          # foreground layers (108dp family) + legacy icons (48-192)
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          declare -A LG=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            convert assets/icon.png -resize ${FG[$d]}x${FG[$d]} -background '#060306' -gravity center -extent ${FG[$d]}x${FG[$d]} $RES/mipmap-$d/ic_launcher_foreground.png
            cp $RES/mipmap-$d/ic_launcher_foreground.png $RES/mipmap-$d/ic_launcher_round_foreground.png
            convert assets/icon.png -resize ${LG[$d]}x${LG[$d]} -background '#060306' -gravity center -extent ${LG[$d]}x${LG[$d]} $RES/mipmap-$d/ic_launcher.png
            convert assets/icon.png -resize ${LG[$d]}x${LG[$d]} \( +clone -alpha extract -draw 'fill black polygon 0,0 0,$s 100,100 $s,0' -negate \) -alpha off -compose CopyOpacity -compose over -background none -flatten /dev/null 2>/dev/null || true
            convert assets/icon.png -crop ${LG[$d]}x${LG[$d]}+0+0 -alpha set \( -clone 0 -alpha extract -draw 'fill black circle 50%,50% 50%,50%' -negate -resize ${LG[$d]}x${LG[$d]} \) \( -clone 0 -alpha extract \) -compose DstIn -compose CopyOpacity +page -background none -flatten $RES/mipmap-$d/ic_launcher_round.png 2>/dev/null || cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
          ls $RES/mipmap-xxxhdpi/

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sur-sangam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
