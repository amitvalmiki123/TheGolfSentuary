name: Build Android APK

on:
  push:
    branches: [ "arena/f257d954-thegolfsentuary", "main", "gh-pages" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build PWA
        run: npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --save

      - name: Init Capacitor Android
        run: |
          npx cap init "Sur Sangam" com.sursangam.app --web-dir=dist || true
          npx cap add android || true
          npx cap copy android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sur-sangam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create Release APK (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
